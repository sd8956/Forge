name: demo-project
platforms: [web]
stack:
  language: javascript
  runtime: node22
  frameworks: []
commands:
  build: make build
  lint: make lint
  unit: make unit
  check: make check
  up: make up
  e2e: make e2e
policies:
  # auto (default): Claude Code's classifier answers prompts, within the deny rules and the guard. agent: the agent's mode.
  permission_mode: auto
  step_timeout_minutes: 45
  max_stop_blocks: 3
review:
  # Everyone with write access to the repo counts; list extra GitHub logins here, or "*" for anyone.
  allowed_authors: [sd8956]
  poll_interval_seconds: 60
